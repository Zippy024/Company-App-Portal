<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<title>Company Application Portal</title>
<link rel="icon" type="image/png" sizes="256x256" href="./favicon.png" />
<link rel="shortcut icon" href="./favicon.ico" />

<style>
:root{--navy:#0c285d;--blue:#0b69c5;--line:#cbdcf4;--ink:#10295b;--muted:#506684;--canvas:#eef6ff;--pale:#f5f9ff;font-family:"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(145deg,#edf6ff,#e1efff);color:var(--ink);display:grid;place-items:center;padding:20px}
.portal{width:min(1210px,100%);height:min(875px,calc(100dvh - 40px));min-height:460px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 22px 70px #2360a325;display:flex;flex-direction:column;border:1px solid #d5e5f7}
.header{flex:none;padding:25px 39px 26px;color:#fff;background:linear-gradient(118deg,#1565ae 0%,#069de1 54%,#0b63c3 100%);position:relative;overflow:hidden}
.header:after{content:"";position:absolute;width:70%;height:170px;right:-70px;bottom:-135px;border-radius:50%;background:#83d7ff24;pointer-events:none}
.eyebrow{font-size:12px;font-weight:750;letter-spacing:1.1px}.heading{display:flex;align-items:center;gap:18px;margin-top:13px}
.mark{display:grid;grid-template-columns:repeat(2,23px);grid-template-rows:repeat(2,23px);gap:5px;flex:none}.mark span{background:#c7e7fe;border-radius:6px}
h1{margin:0;font-size:34px;line-height:1.15;letter-spacing:-.5px} .heading p{margin:7px 0 0;font-size:17px;color:#effaff}
.content{padding:24px 36px 22px;min-height:0;display:flex;flex:1;flex-direction:column}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;flex:none}
h2{margin:0;font-size:24px;display:flex;align-items:center;gap:13px}
.stacked{font-size:24px;color:#1466b9;line-height:1}
.search{position:relative;width:min(365px,45%)}.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#426999}
.search input{width:100%;height:47px;border:1.5px solid #bed5f4;border-radius:30px;background:#fbfdff;padding:0 18px 0 48px;font:inherit;font-size:15px;color:var(--ink);outline:none}
.search input:focus{border-color:#3488d7;box-shadow:0 0 0 3px #3488d71a}
.list-window{min-height:0;flex:1;overflow-y:auto;overscroll-behavior:contain;border:1.5px solid var(--line);padding:10px;border-radius:17px;background:#fff;scrollbar-color:#82c3ff #f1f7ff;scrollbar-width:thin}
.list-window::-webkit-scrollbar{width:10px}.list-window::-webkit-scrollbar-track{background:#f1f7ff;border-radius:10px}.list-window::-webkit-scrollbar-thumb{background:#83c1fa;border-radius:10px;border:2px solid #f1f7ff}
.list{display:flex;flex-direction:column;gap:9px}.entry{border:1px solid #cddff7;border-radius:13px;background:linear-gradient(90deg,#f3f8ff,#f9fbff);padding:12px 18px;display:flex;align-items:center;gap:22px;min-height:77px}
.num{background:#deedff;min-width:56px;height:47px;display:grid;place-items:center;border-radius:10px;font-weight:800;font-size:20px;color:#124c9d;font-variant-numeric:tabular-nums}
.entry-copy{border-left:2px solid #a4c4ed;padding-left:22px;min-width:0;flex:1}.entry-title{font-size:18px;font-weight:750;line-height:1.3}.entry-description{font-size:14px;margin-top:3px;color:#344d71}
.open{flex:none;background:#0564bd;border:0;border-radius:10px;color:#fff;font-size:15px;font-weight:700;min-height:44px;min-width:132px;cursor:pointer;display:inline-flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 3px 9px #0064b31a}
.open:hover{background:#084f9a}.open:focus-visible{outline:3px solid #75b6ff;outline-offset:2px}.open svg{width:17px;height:17px}
.empty{padding:35px 15px;text-align:center;color:#61718b}.notice{flex:none;display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px 18px;background:#f0f6ff;border-radius:13px;color:#233d6f;font-size:13px}.notice strong{color:#123a85}.notice .info{font-size:21px;font-weight:bold;color:#125fb4}.updated{margin-left:auto;white-space:nowrap;color:#486283}
.feedback{color:#a94327;font-size:13px;min-height:0;line-height:1.35}.feedback:not(:empty){margin-top:8px}
@media(max-width:700px){body{padding:0}.portal{height:100dvh;min-height:0;border-radius:0}.header{padding:23px}.content{padding:18px}.toolbar{align-items:stretch;flex-direction:column;gap:13px}h1{font-size:26px}h2{font-size:20px}.heading p{font-size:14px}.search{width:100%}.entry{gap:10px;padding:12px;min-height:74px}.num{min-width:42px;height:40px;font-size:16px}.entry-copy{padding-left:11px}.entry-title{font-size:14px}.entry-description{font-size:12px}.open{min-width:70px;font-size:13px;min-height:39px;gap:5px}.open svg{display:none}.notice{font-size:11px}.updated{display:none}}
</style>
</head>
<body>
<main class="portal">
  <header class="header">
    <div class="eyebrow">COMPANY INTERNAL APPLICATION DIRECTORY</div>
    <div class="heading"><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div><h1>Application Portal</h1><p>Company Applications – Click to open</p></div></div>
  </header>
  <section class="content" aria-label="Applications">
    <div class="toolbar"><h2><span class="stacked" aria-hidden="true">▱</span> Application List</h2>
      <label class="search"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search application..." aria-label="Search application" autocomplete="off" /></label>
    </div>
    <div class="list-window" id="scrollArea"><div class="list" id="appList"></div></div>
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <footer class="notice"><span class="info" aria-hidden="true">ⓘ</span><strong>Notice:</strong><span>Please use your company account and follow each program's policy.</span><span class="updated">Company Application Portal</span></footer>
  </section>
</main>
<script>
/* ==========================================================
  EDIT LINKS HERE ONLY. Add a new object for every new app.
  - "url" must be the real HTTPS Published Appsmith / website URL.
  - Leave url:'' if not linked yet; Open will show a message.
  - Do not put passwords, API keys, or employee data here.
  Example:
  { name:'New Program', description:'Short description', url:'https://example.com' },
========================================================== */
const APPS = [
  { name:'TOFAS Test Program',       description:'Practice / HR Test / Official Test', url:'' },
  { name:'TOFAS HR Answer Review',   description:'Check Answers & Details',            url:'' },
  { name:'Driver Attendance',        description:'Daily In/Out & OT Approval',         url:'' },
  { name:'PIT Management',           description:'Payroll PIT & WHT Calculation',      url:'' }
];

const list = document.getElementById('appList');
const search = document.getElementById('search');
const scrollArea = document.getElementById('scrollArea');
const feedback = document.getElementById('feedback');
function validUrl(raw){
  if(typeof raw !== 'string' || !raw.trim())return null;
  try{const parsed = new URL(raw.trim());return parsed.protocol === 'https:' ? parsed.href : null;}catch{return null;}
}
function openApp(app){
  const url=validUrl(app.url);
  if(!url){feedback.textContent=`${app.name}: Link has not been added yet. Please contact the portal administrator.`;return;}
  feedback.textContent='';
  // Navigates in the same browser tab; clicking Back returns to the Portal.
  window.location.assign(url);
}
function render(){
  feedback.textContent='';
  const term=search.value.trim().toLowerCase();
  list.replaceChildren();
  let count=0;
  APPS.forEach((app,i)=>{
    if(!`${app.name} ${app.description||''}`.toLowerCase().includes(term))return;
    count++;
    const row=document.createElement('article');row.className='entry';
    const number=document.createElement('span');number.className='num';number.textContent=String(i+1).padStart(2,'0');
    const details=document.createElement('div');details.className='entry-copy';
    const title=document.createElement('div');title.className='entry-title';title.textContent=app.name;
    const description=document.createElement('div');description.className='entry-description';description.textContent=app.description||'';
    details.append(title,description);
    const button=document.createElement('button');button.className='open';button.type='button';button.setAttribute('aria-label',`Open ${app.name}`);
    button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h6v6"/><path d="M19 5 10 14"/><path d="M19 13v6H5V5h6"/></svg><span>Open</span>';
    button.addEventListener('click',()=>openApp(app));
    row.append(number,details,button);list.append(row);
  });
  if(count===0){const none=document.createElement('div');none.className='empty';none.textContent='No matching applications found.';list.append(none);}
  scrollArea.scrollTop=0;
}
search.addEventListener('input',render);
render();
</script>
</body>
</html>
